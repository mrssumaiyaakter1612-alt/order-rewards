<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Rewards</title>
<style>
  :root { --bg:#f7f7fb; --card:#fff; --text:#1c1c28; --muted:#6b6b80; --accent:#4f46e5; --ok:#16a34a; --bad:#dc2626; --line:#e3e3ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14141c; --card:#1e1e2a; --text:#f0f0f7; --muted:#a0a0b5; --accent:#818cf8; --line:#33334a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:520px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:26px; margin:8px 0; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  input { width:100%; padding:13px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); }
  button { width:100%; margin-top:14px; padding:13px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .msg { margin-top:12px; font-size:15px; min-height:20px; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  .who { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); font-size:14px; margin-bottom:12px; }
  .who a { color:var(--accent); cursor:pointer; text-decoration:underline; white-space:nowrap; }
  .boxes { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .box { border:2px dashed var(--line); border-radius:14px; padding:16px 8px; text-align:center; background:var(--card); }
  .box:last-child { grid-column:1 / -1; }
  .pct { font-size:34px; font-weight:800; color:var(--muted); }
  .state { margin-top:6px; font-size:14px; color:var(--muted); }
  .box.open { border:2px solid var(--ok); }
  .box.open .pct { color:var(--accent); }
  .box.open .state { color:var(--text); }
  .code { display:inline-block; margin-top:4px; padding:4px 12px; border-radius:8px; background:var(--bg); border:1px dashed var(--ok); font-weight:800; letter-spacing:1px; font-size:18px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <h1>Order Rewards</h1>
    <p class="sub">Log in with your email to track your orders and unlock discounts.</p>
    <div class="card">
      <input id="email" type="email" placeholder="Your email" autocomplete="email">
      <button id="loginBtn">Continue</button>
      <div class="msg" id="msgL"></div>
    </div>
  </div>

  <div id="dash" hidden>
    <h1>Your Rewards</h1>
    <div class="who"><span id="who"></span><a id="logout">Log out</a></div>
    <div class="boxes" id="boxes"></div>
    <div class="card">
      <input id="order" type="text" placeholder="Enter your order number" autocomplete="off">
      <button id="btn">Submit</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

</div>

<script>
  // Paste your Google Apps Script Web App URL here:
  const API_URL = 'https://script.google.com/macros/s/AKfycbxAYEQ6jf7bPg_NmRr_XwUSNXECLrMECaYlg0Ii6zjJwJN8Sh7oFtoWy-0TJKESxkKy/exec';

  const TIERS = [10, 20, 30, 40, 50];
  const $ = id => document.getElementById(id);
  let email = '';

  function renderBoxes(codes) {
    const b = $('boxes'); b.textContent = '';
    TIERS.forEach((t, i) => {
      const d = document.createElement('div');
      const open = i < codes.length;
      d.className = 'box' + (open ? ' open' : '');
      const p = document.createElement('div'); p.className = 'pct'; p.textContent = t + '%';
      const s = document.createElement('div'); s.className = 'state';
      d.appendChild(p); d.appendChild(s);
      if (open) {
        s.textContent = 'Promo code';
        const c = document.createElement('div'); c.className = 'code'; c.textContent = codes[i];
        d.appendChild(c);
      } else {
        s.textContent = '🔒 Locked';
      }
      b.appendChild(d);
    });
  }

  function setMsg(id, text, cls) { const m = $(id); m.textContent = text; m.className = 'msg ' + (cls || ''); }

  async function api(params) {
    if (API_URL.indexOf('PASTE_') === 0) throw new Error('no_api');
    const r = await fetch(API_URL + '?' + new URLSearchParams(Object.assign({ email: email }, params)).toString());
    return r.json();
  }

  function showDash(d) {
    $('login').hidden = true; $('dash').hidden = false;
    $('who').textContent = email;
    renderBoxes(d.codes || []);
  }

  async function login(e) {
    e = (e || '').trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(e)) { setMsg('msgL', 'Please enter a valid email.', 'bad'); return; }
    email = e;
    $('loginBtn').disabled = true; setMsg('msgL', 'Loading…');
    try {
      const d = await api({ action: 'status' });
      if (!d.ok) { setMsg('msgL', 'Please enter a valid email.', 'bad'); return; }
      try { localStorage.setItem('rw_email', email); } catch (x) {}
      setMsg('msgL', ''); setMsg('msg', '');
      showDash(d);
    } catch (x) {
      setMsg('msgL', API_URL.indexOf('PASTE_') === 0 ? 'Site is not connected yet (API_URL missing).' : 'Something went wrong. Please try again.', 'bad');
    } finally { $('loginBtn').disabled = false; }
  }

  const MSG = {
    ok: ['Order verified! A new box is unlocked.', 'ok'],
    already: ['This order is already on your account.', ''],
    used_other: ['This order number was already used on another account.', 'bad'],
    invalid: ['Order number not found. Please check it and try again.', 'bad'],
    full: ['All 5 boxes are already unlocked.', '']
  };

  async function submit() {
    const o = $('order').value.trim();
    if (!o) { setMsg('msg', 'Please enter your order number.', 'bad'); return; }
    $('btn').disabled = true; setMsg('msg', 'Checking…');
    try {
      const d = await api({ action: 'claim', order: o });
      if (!d.ok) { setMsg('msg', 'Something went wrong. Please log in again.', 'bad'); return; }
      renderBoxes(d.codes || []);
      const m = MSG[d.result] || ['', ''];
      setMsg('msg', m[0], m[1]);
      if (d.result === 'ok') $('order').value = '';
    } catch (x) {
      setMsg('msg', 'Something went wrong. Please try again.', 'bad');
    } finally { $('btn').disabled = false; }
  }

  $('loginBtn').addEventListener('click', () => login($('email').value));
  $('email').addEventListener('keydown', e => { if (e.key === 'Enter') login($('email').value); });
  $('btn').addEventListener('click', submit);
  $('order').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  $('logout').addEventListener('click', () => {
    try { localStorage.removeItem('rw_email'); } catch (x) {}
    email = ''; $('dash').hidden = true; $('login').hidden = false; $('email').value = ''; setMsg('msg', '');
  });

  renderBoxes([]);
  try { const saved = localStorage.getItem('rw_email'); if (saved) { $('email').value = saved; login(saved); } } catch (x) {}
</script>
</body>
</html>
