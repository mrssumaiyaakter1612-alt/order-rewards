<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin - Add Orders</title>
<style>
  :root { --bg:#f7f7fb; --card:#fff; --text:#1c1c28; --muted:#6b6b80; --accent:#4f46e5; --ok:#16a34a; --bad:#dc2626; --line:#e3e3ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14141c; --card:#1e1e2a; --text:#f0f0f7; --muted:#a0a0b5; --accent:#818cf8; --line:#33334a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:560px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:24px; margin:8px 0; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  input, textarea { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); font-family:inherit; }
  textarea { min-height:200px; resize:vertical; }
  button { width:100%; margin-top:14px; padding:13px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .msg { margin-top:12px; font-size:15px; min-height:20px; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Add Orders</h1>
  <p class="sub">Paste order numbers, one per line. To group orders by customer, add the email after the number (example: <b>123456 rahim@gmail.com</b>).</p>
  <div class="card">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <label for="txt">Order numbers</label>
    <textarea id="txt" placeholder="123456&#10;123457 rahim@gmail.com&#10;123458"></textarea>
    <button id="btn">Add orders</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
  // Paste your Google Apps Script Web App URL here (same one as index.html):
  const API_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';
  const $ = id => document.getElementById(id);
  function setMsg(t, c) { $('msg').textContent = t; $('msg').className = 'msg ' + (c || ''); }

  $('btn').addEventListener('click', async () => {
    const text = $('txt').value.trim();
    if (!$('pw').value) { setMsg('Enter the admin password.', 'bad'); return; }
    if (!text) { setMsg('Paste at least one order number.', 'bad'); return; }
    if (API_URL.indexOf('PASTE_') === 0) { setMsg('API_URL is missing in this file.', 'bad'); return; }
    $('btn').disabled = true; setMsg('Saving…');
    try {
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ password: $('pw').value, text: text }) });
      const d = await r.json();
      if (!d.ok) { setMsg(d.error === 'wrong_password' ? 'Wrong password.' : 'Something went wrong.', 'bad'); return; }
      setMsg('Added ' + d.added + ' order(s)' + (d.duplicates ? ', skipped ' + d.duplicates + ' already in the list.' : '.'), 'ok');
      $('txt').value = '';
    } catch (e) {
      setMsg('Could not connect. Please try again.', 'bad');
    } finally {
      $('btn').disabled = false;
    }
  });
</script>
</body>
</html>
